{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-8 mt-10">
  <h2 class="text-2xl font-bold text-center mb-4">Reset Your Password</h2>
  <p class="text-sm text-gray-600 text-center mb-6">Enter your email address and we’ll send you a link to reset your password.</p>
  <form method="POST" action="{% url 'account_reset_password' %}" class="space-y-4">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-lg w-full">
      Send Reset Email
    </button>
  </form>
</div>
{% endblock %}
